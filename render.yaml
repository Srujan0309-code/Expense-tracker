services:
  - type: web
    name: expense-tracker-api-srujan0309
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://expense-tracker-client-srujan0309.onrender.com
      - key: CLIENT_URLS
        value: https://expense-tracker-jqo2yiy3a-srujanpoojaris-projects.vercel.app,https://expense-tracker-client-srujan0309.onrender.com

  - type: web
    name: expense-tracker-client-srujan0309
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://expense-tracker-api-srujan0309.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
